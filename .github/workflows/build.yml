name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libmpv-dev liblzma-dev libsecret-1-dev
      - name: Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter (arm64, from source tag)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics --enable-linux-desktop
      - run: flutter build linux --release
      - name: Package
        run: |
          set -euo pipefail
          name="TorBox-STRM-linux-${{ matrix.arch }}"
          mkdir -p dist
          cp -r build/linux/${{ matrix.arch }}/release/bundle "dist/$name"
          cp packaging/linux/README-linux.txt "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: TorBox-STRM-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --no-analytics --enable-windows-desktop
      - run: flutter build windows --release
      - name: Bundle the Visual C++ runtime next to the app
        shell: pwsh
        run: |
          # App-local deployment: the app starts even where the VC++ Redistributable is missing.
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Package (installer + portable zip)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress | Out-Null
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $release = (Resolve-Path build/windows/x64/runner/Release).Path
          $out = (Resolve-Path dist).Path
          iscc "/DAppVersion=$version" "/DSourceDir=$release" "/DOutputDir=$out" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "dist/TorBox-STRM" | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* "dist/TorBox-STRM/"
          Compress-Archive -Path "dist/TorBox-STRM" -DestinationPath dist/TorBox-STRM-windows-x64-portable.zip
          Remove-Item -Recurse "dist/TorBox-STRM"
      - uses: actions/upload-artifact@v4
        with:
          name: TorBox-STRM-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  android:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Keys created with the same store and key password need only one secret.
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-torboxstrm}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          # Public certificate fingerprint, to check the secret is the expected key.
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-torboxstrm}" \
            | grep -E "SHA256:|SHA-256" | head -1
      - run: flutter build apk --release --split-per-abi
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/TorBox-STRM-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TorBox-STRM-android
          path: dist/*.apk
          if-no-files-found: error

  # Android ships first; desktop builds are attached to the same release when done.
  release-android:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TorBox-STRM-android
          path: release-assets
      - name: Publish release with the APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          signed="debug key"
          if [ "$HAS_RELEASE_KEY" = "true" ]; then signed="release key"; fi
          notes="$(sed "s/@ANDROID_SIGNING@/$signed/" packaging/release-notes.md)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.apk --clobber
          else
            gh release create "$TAG" release-assets/*.apk --prerelease --verify-tag \
              --title "TorBox STRM $TAG" --notes "$notes"
          fi

  release-desktop:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [linux, windows, release-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TorBox-STRM-*
          path: release-assets
          merge-multiple: true
      - name: Attach desktop builds and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" * --clobber
